[package]
name = "sensor-probe"
version = "0.1.0"
edition = "2024"
default-run = "sensor-probe"

[dependencies]
adlx-lite = "1.0.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk", "network"] }
libloading = "0.9.1"
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13.0"
tiny_http = "0.12"
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_ToolHelp", "Wdk_Graphics_Direct3D"] }
windows = { version = "0.62.2", features = ["Devices_Enumeration", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

base64 = "0.22"
getrandom = "0.4"
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
winreg = "0.55"
keyvalues-parser = "0.2.4"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.2", default-features = false }
