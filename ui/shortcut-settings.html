<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>壁纸仪表盘设置</title>
<script>if (window.wallpaperDashboardDesktop) document.documentElement.classList.add("desktop-window");</script>
<style>
:root {
  color-scheme: light dark;
  font: 13px/1.55 "Segoe UI", "Microsoft YaHei UI", sans-serif;
  color: #212328;
  background: #c7c7ca;
  --wallpaper: radial-gradient(ellipse at 8% 4%, #f9f9f9 0%, transparent 53%),
    radial-gradient(ellipse at 92% 86%, #f2f2f4 0%, transparent 48%),
    linear-gradient(145deg, #d8d8da, #a2a3a8 58%, #d1d1d3);
  --muted: #505258;
  --line: #24262b22;
  --rim: #ffffffa0;
  --accent: #41434a;
  --accent-hover: #31333a;
  --accent-ink: #fff;
  --accent-soft: #282a3320;
  --accent-text: #25272e;
  --surface: #e9e9ec;
  --control: #ffffff68;
  --sidebar: #f2f2f45c;
  --canvas: #f4f4f53c;
  --group: linear-gradient(152deg, #ffffff6e, #ffffff36 64%, #ffffff46);
  --hover: #26283214;
  --meter-fill: linear-gradient(90deg, #4a4c55, #858892);
  --good-text: #156442;
  --good-bg: #e3f5eb;
  --warning-text: #795218;
  --warning-bg: #fff3d9;
  --shadow: inset 0 1px 0 var(--rim), 0 4px 16px #25253012;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; padding: clamp(18px, 6vw, 76px) 20px; background: var(--wallpaper) fixed; }
.shell { display: grid; grid-template-columns: 185px minmax(0, 1fr); width: min(100%, 920px); min-height: min(590px, calc(100vh - 40px)); margin: auto; border: 1px solid var(--rim); border-radius: 22px; overflow: hidden; background: var(--canvas); box-shadow: 0 24px 64px #1515193d; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); padding: 20px 12px; backdrop-filter: blur(20px); }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 5px 24px; color: inherit; font-size: 14px; font-weight: 700; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; flex: 0 0 29px; height: 29px; border: 1px solid var(--rim); border-radius: 8px; color: var(--accent-ink); background: var(--accent); box-shadow: var(--shadow); font-size: 19px; }
nav { display: grid; gap: 4px; }
nav a { display: flex; align-items: center; gap: 8px; min-height: 40px; color: var(--muted); padding: 5px 9px; border-radius: 8px; text-decoration: none; font-weight: 600; }
nav a:hover { background: var(--hover); }
nav a[aria-current="page"] { color: var(--accent-text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--rim); }
.nav-icon { display: grid; place-items: center; flex: 0 0 22px; height: 22px; font: 17px/1 "Segoe UI Symbol", sans-serif; }
main { min-width: 0; }
h1, h2, p { margin: 0; }
h1 { font-size: 25px; font-weight: 700; line-height: 1.2; }
h2 { font-size: 14px; font-weight: 650; }
p, .count { color: var(--muted); }
.page-heading { display: flex; align-items: center; min-height: 68px; padding: 15px 24px; border-bottom: 1px solid var(--line); background: var(--sidebar); backdrop-filter: blur(22px); }
.panel-body { padding: 20px 24px 24px; }
.section-heading, .toolbar, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.section-heading { justify-content: space-between; }
.card { background: var(--group); border: 1px solid var(--line); border-radius: 15px; padding: 14px 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.toolbar > input { flex: 1; min-width: 0; }
button, select, input:not([type="radio"], [type="checkbox"]) { min-height: 34px; font: inherit; color: inherit; border: 1px solid var(--line); background: var(--control); padding: 5px 11px; border-radius: 8px; }
button { cursor: pointer; box-shadow: 0 1px 1px #15162114; }
button:disabled { opacity: .45; cursor: default; }
button:hover:not(:disabled) { background: var(--accent-soft); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { background: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
fieldset { display: inline-flex; gap: 2px; position: relative; border: 0; border-radius: 6px; background: var(--hover); margin: 11px 0; padding: 2px; }
fieldset label { position: relative; display: block; cursor: pointer; }
fieldset label span { display: block; padding: 3px 12px; border-radius: 5px; }
fieldset label:has(:checked) span { background: var(--surface); box-shadow: 0 1px 3px #16172828; }
input[type="radio"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
input[type="radio"]:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
input:disabled { opacity: .54; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.setting-row p { margin-top: 3px; }
.update-actions { justify-content: flex-end; }
.update-download { display: inline-flex; align-items: center; min-height: 34px; padding: 5px 11px; border-radius: 8px; color: var(--accent-ink); background: var(--accent); text-decoration: none; white-space: nowrap; }
.update-download:hover { background: var(--accent-hover); }
#update-status { margin-top: 8px; }
@media (max-width: 480px) { .update-row { flex-wrap: wrap; } .update-actions { justify-content: flex-start; } }
#startup-enabled { appearance: none; display: block; flex: 0 0 39px; width: 39px; height: 23px; margin: 0; padding: 3px; border: 0; border-radius: 999px; background: var(--muted); cursor: pointer; }
#startup-enabled::before { content: ""; display: block; width: 17px; height: 17px; border-radius: 50%; background: white; }
#startup-enabled:checked { background: var(--accent); }
#startup-enabled:checked::before { transform: translateX(16px); }
#startup-enabled:disabled { cursor: default; }
.weather-mode { min-width: 0; margin: 0; }
#weather-form .toolbar { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
#weather-result, #weather-status { margin-top: 12px; }
#weather-result { padding-top: 9px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
#collection-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; color: var(--muted); background: var(--hover); font-size: 12px; font-weight: 600; }
#collection-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
#collection-status[data-state="connected"] { color: var(--good-text); background: var(--good-bg); }
#collection-status[data-state="error"] { color: var(--warning-text); background: var(--warning-bg); }
.collection-notice { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; color: var(--warning-text); background: var(--warning-bg); }
.readings { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; margin: 5px 0 14px; }
.readings dt { color: var(--muted); overflow-wrap: anywhere; }
.readings dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.rows { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.rows .card { margin: 0; }
.rows p, #status { margin-top: 10px; }
.overview { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.overview > .metric-card { min-width: 0; margin: 0; backdrop-filter: blur(16px); }
.metric-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.metric-group > .card { margin: 0; }
.metric-group > .card:last-child { grid-column: 1 / -1; }
.metric-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.metric-value { display: block; font-size: 22px; line-height: 1.2; font-weight: 680; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric-value:empty { display: none; }
.metric-label { margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.metric-label:empty { display: none; }
.overview .metric-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usage-meter { display: block; width: 100%; height: 6px; margin: 10px 0 2px; appearance: none; }
.meter-placeholder { border-radius: 6px; background: var(--hover); }
.usage-meter::-webkit-meter-bar { border: 0; border-radius: 6px; background: var(--hover); }
.usage-meter::-webkit-meter-optimum-value { border-radius: 6px; background: var(--meter-fill); }
.metric-list { margin: 9px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
.metric-list dd { white-space: nowrap; }
.disk-usage { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
.disk-usage h3 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
.disk-usage ul { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0; padding: 0; list-style: none; }
.disk-usage li { padding: 2px 5px; border: 0; border-radius: 5px; background: var(--hover); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.disk-usage p { margin-top: 4px; font-size: 12px; }
.shortcut-lanes { margin-top: 0; }
.shortcut-lanes ol { margin-top: 9px; }
.shortcut-lanes ol { padding: 0; list-style: none; }
.shortcut-entry { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; }
.shortcut-entry img { width: 32px; height: 32px; margin: 0; object-fit: contain; }
.shortcut-entry > span { overflow-wrap: anywhere; }
.shortcut-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; color: var(--muted); background: var(--hover); }
.entry-menu { position: relative; }
.entry-menu summary { list-style: none; cursor: pointer; border-radius: 5px; padding: 3px 8px; font-size: 16px; line-height: 1.3; }
.entry-menu summary:hover, .entry-menu[open] summary { background: var(--hover); }
.entry-menu .actions { position: absolute; right: 0; top: 100%; display: grid; gap: 1px; min-width: 128px; max-height: 140px; overflow: auto; z-index: 2; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); box-shadow: 0 5px 18px #0003; }
.entry-menu .actions button { padding: 4px 8px; border: 0; text-align: left; box-shadow: none; }
.shortcut-lanes ol:empty { display: none; }
.lane-empty { display: grid; place-content: center; min-height: 62px; margin-top: 10px; border-radius: 8px; background: var(--canvas); text-align: center; }
.recent-apps { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.recent-apps p { margin-top: 6px; }
.recent-apps ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.recent-apps li { max-width: 100%; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--control); overflow-wrap: anywhere; }
.picker-count { margin-top: 9px; font-size: 12px; }
.lane-empty p { margin: 0; }
dialog { width: min(520px, calc(100% - 28px)); max-height: calc(100% - 26px); padding: 0; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 15px 45px #0005; }
dialog::backdrop { background: #0006; }
.picker-results { max-height: min(260px,35vh); overflow: auto; margin-top: 10px; border-top: 1px solid var(--line); }
.picker-item { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.picker-item span:first-child { overflow-wrap: anywhere; }
.picker-item small { color: var(--muted); }
ol { padding-left: 1.3rem; margin: 0; }
li { padding: 9px 0; border-top: 1px solid var(--line); }
li img { width: 30px; height: 30px; vertical-align: middle; margin-right: 6px; border-radius: 7px; }
li .actions { margin-top: 6px; }
li button { min-height: 30px; padding: 3px 7px; font-size: 12px; }
.count { font-size: 12px; font-weight: 400; }
@media (max-width: 650px) {
  body { padding: 0; }
  .shell { grid-template-columns: 1fr; }
  .shell { border: 0; border-radius: 0; box-shadow: none; min-height: 100vh; align-content: start; }
  .sidebar { padding: 9px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { margin: 0 0 5px; }
  nav { display: flex; flex-wrap: wrap; }
  .page-heading, .panel-body { padding-inline: 14px; }
  .page-heading { min-height: 58px; }
  h1 { font-size: 21px; }
  .rows { grid-template-columns: 1fr; }
}
@media (max-width: 760px) { .overview { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 420px) { .overview, .metric-group { grid-template-columns: 1fr; } }
@media (max-width: 360px) { .setting-row { flex-wrap: wrap; } }
@media (prefers-color-scheme: dark) {
  :root {
    color: #f4f4f5;
    background: #232427;
    --wallpaper: radial-gradient(ellipse at 0% 0%, #626367 0%, transparent 57%),
      radial-gradient(ellipse at 100% 92%, #58595e 0%, transparent 51%),
      linear-gradient(148deg, #36373a, #1d1e21 59%, #3d3e41);
    --muted: #d0d0d3;
    --line: #ffffff27;
    --rim: #ffffff32;
    --surface: #38393e;
    --control: #eeeef21a;
    --sidebar: #1d1d2170;
    --canvas: #27272b38;
    --group: linear-gradient(152deg, #ebebef25, #bfbfc313 62%, #e6e6ea1c);
    --hover: #ffffff19;
    --accent: #dbdce0;
    --accent-hover: #f1f1f3;
    --accent-ink: #25262a;
    --accent-soft: #ffffff26;
    --accent-text: #fff;
    --meter-fill: linear-gradient(90deg, #858790, #d7d8dd);
    --good-text: #b9ead2;
    --good-bg: #2b493fcc;
    --warning-text: #f3d29b;
    --warning-bg: #49371f;
    --shadow: inset 0 1px 0 #ffffff15, 0 7px 18px #0c0c1026;
  }
}
.desktop-window body { padding: 0; }
.desktop-window .shell { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
.desktop-window main { overflow: auto; }
.desktop-window .page-heading { position: sticky; top: 0; z-index: 1; }
@media (max-width: 650px) {
  .desktop-window .shell { grid-template-rows: auto minmax(0, 1fr); align-content: stretch; }
}
</style>
<div class="shell">
<aside class="sidebar">
  <p class="brand"><span class="brand-mark" aria-hidden="true">▥</span>壁纸仪表盘</p>
  <nav aria-label="设置导航">
    <a href="#general"><span class="nav-icon" aria-hidden="true">⚙</span>常规</a>
    <a href="#weather"><span class="nav-icon" aria-hidden="true">☼</span>天气</a>
    <a href="#collection"><span class="nav-icon" aria-hidden="true">≋</span>采集状态</a>
    <a href="#shortcuts"><span class="nav-icon" aria-hidden="true">▦</span>应用和游戏</a>
  </nav>
</aside>
<main>
<section id="general">
  <header class="page-heading"><h1>常规</h1></header>
  <div class="panel-body"><div class="card setting-row">
    <div><h2><label for="startup-enabled">登录 Windows 时启动采集器</label></h2>
    <p id="startup-status" role="status">正在读取自启设置…</p></div>
    <input id="startup-enabled" type="checkbox" role="switch" aria-describedby="startup-status" disabled>
  </div>
  <section class="card">
    <div class="setting-row update-row">
      <div><h2>版本与更新</h2><p id="current-version">正在读取版本…</p></div>
      <div class="actions update-actions">
        <button id="check-update" type="button">检查更新</button>
        <a class="update-download" id="download-update" target="_blank" rel="noopener noreferrer" hidden>下载更新</a>
      </div>
    </div>
    <p id="update-status" role="status" hidden></p>
  </section>
  </div>
</section>
<section id="weather">
  <header class="page-heading"><h1>天气</h1></header>
  <div class="panel-body">
  <form class="card" id="weather-form">
    <div class="setting-row"><h2>城市来源</h2>
    <fieldset class="weather-mode" id="weather-mode" aria-label="天气城市来源" disabled>
      <label><input type="radio" name="mode" value="auto" id="weather-auto"><span>自动定位</span></label>
      <label><input type="radio" name="mode" value="manual" id="weather-manual"><span>手动城市</span></label>
    </fieldset></div>
    <div class="toolbar"><label for="city">城市</label><input id="city" maxlength="100" required disabled><button class="primary" id="save-weather" disabled>保存天气</button></div>
    <p id="weather-status" role="status">正在读取天气设置…</p>
  </form>
  <div class="card">
    <div class="section-heading"><h2>定位诊断</h2><button id="test-location" type="button">测试自动定位</button></div>
    <p id="weather-result" role="status" hidden></p>
  </div>
  </div>
</section>
<section id="collection">
  <header class="page-heading section-heading"><h1>采集状态</h1><span id="collection-status" role="status">正在读取…</span></header>
  <div class="panel-body">
    <p class="collection-notice" id="collection-notice" role="status" hidden></p>
    <div class="overview" id="overview" role="group" aria-label="实时使用率"></div>
    <div class="metric-group" id="collection-details" role="group" aria-label="游戏、风扇和设备"></div>
  </div>
</section>
<section id="shortcuts">
  <header class="page-heading section-heading"><h1>应用和游戏</h1><button class="primary" id="save" disabled>保存布局</button></header>
  <div class="panel-body">
  <div class="rows shortcut-lanes">
    <section class="card"><div class="section-heading"><h2>应用栏 <span class="count" id="apps-count"></span></h2><button id="choose-apps" disabled>固定应用</button></div><ol id="apps"></ol><div class="lane-empty" id="apps-empty"><p>没有固定应用</p></div><div class="recent-apps"><h2 id="recent-app-heading">最近使用</h2><ul id="recent-app-list" aria-labelledby="recent-app-heading" hidden></ul><p id="recent-app-empty">暂无记录</p></div></section>
    <section class="card"><div class="section-heading"><h2>游戏栏 <span class="count" id="games-count"></span></h2><button id="choose-games" disabled>固定游戏</button></div><ol id="games"></ol><div class="lane-empty" id="games-empty"><p>没有固定游戏</p></div><p>空位显示最近玩的 Steam 游戏</p></section>
  </div>
  <p id="status" role="status">正在读取快捷方式…</p>
  <input id="icon" type="file" accept="image/*" hidden>
  <dialog id="shortcut-picker" aria-labelledby="picker-title">
    <header class="page-heading section-heading"><h2 id="picker-title"></h2><form method="dialog"><button>关闭</button></form></header>
    <div class="panel-body">
      <div class="toolbar"><input id="search" type="search" placeholder="搜索名称" aria-label="搜索快捷方式" autofocus>
      <select id="source" aria-label="快捷方式来源"><option value="">全部来源</option><option>Windows</option><option>Steam</option></select></div>
      <p class="picker-count" id="picker-count" role="status" hidden></p>
      <div class="picker-results" id="candidates"></div><p id="picker-empty" hidden>没有匹配的快捷方式</p>
    </div>
  </dialog>
  </div>
</section>
</main>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const panels = ["general", "weather", "collection", "shortcuts"];
function showPanel() {
  const target = location.hash.slice(1);
  const selected = panels.includes(target) ? target : location.pathname === "/shortcuts" ? "shortcuts" : "weather";
  for (const panel of panels) {
    $(panel).hidden = panel !== selected;
    const link = document.querySelector(`nav a[href="#${panel}"]`);
    if (panel === selected) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
}
window.addEventListener("hashchange", showPanel);
showPanel();
async function jsonRequest(path, options) {
  const response = await fetch(path, {cache:"no-store", ...options});
  const body = await response.json().catch(() => null);
  if (!response.ok || !body) throw new Error(body?.error || `请求失败（${response.status}）`);
  return body;
}

const showCurrentVersion = ({version, development}) => {
  $("current-version").textContent = `当前版本 ${version}${development ? "（开发构建）" : ""}`;
};
jsonRequest("/settings/update").then(showCurrentVersion).catch(() => {
  $("current-version").textContent = "暂时无法读取当前版本";
});
$("check-update").onclick = async () => {
  const button = $("check-update");
  const status = $("update-status");
  const download = $("download-update");
  button.disabled = true;
  download.hidden = true;
  download.removeAttribute("href");
  status.hidden = false;
  status.textContent = "正在检查更新…";
  try {
    const result = await jsonRequest("/settings/update", {method:"POST"});
    if (result.state === "available") {
      download.href = result.url;
      download.hidden = false;
      status.textContent = `发现新版本 ${result.version}`;
    } else {
      status.textContent = result.state === "up_to_date" ? "已是最新版本" : "当前渠道暂无发布";
    }
  } catch {
    status.textContent = "暂时无法检查更新，请重试";
  } finally {
    button.disabled = false;
  }
};

const showStartup = enabled => {
  $("startup-enabled").checked = enabled;
  $("startup-status").textContent = enabled ? "已启用，下一次登录时从托盘启动。" : "当前未启用。";
};
jsonRequest("/settings/startup").then(({enabled}) => {
  showStartup(enabled);
  $("startup-enabled").disabled = false;
}).catch(error => { $("startup-status").textContent = error.message; });
$("startup-enabled").onchange = async event => {
  const control = event.currentTarget;
  const enabled = control.checked;
  control.disabled = true;
  try {
    const result = await jsonRequest("/settings/startup", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enabled})});
    showStartup(result.enabled);
  } catch (error) {
    control.checked = !enabled;
    $("startup-status").textContent = error.message;
  } finally { control.disabled = false; }
};

const showWeather = data => {
  $("city").value = data.city;
  $("weather-auto").checked = !data.city;
  $("weather-manual").checked = !!data.city;
  $("city").disabled = !data.city;
  $("weather-status").textContent = data.city ? `壁纸正在使用 ${data.city}` : "壁纸正在使用自动定位";
};
$("weather-mode").onchange = () => { $("city").disabled = $("weather-auto").checked; };
$("weather-form").onsubmit = async event => {
  event.preventDefault();
  $("save-weather").disabled = true;
  try {
    const city = $("weather-auto").checked ? "" : $("city").value.trim();

  } catch (error) { $("weather-status").textContent = error.message; }

jsonRequest("/settings/weather").then(data => {
  showWeather(data);
  $("weather-mode").disabled = false;

$("test-location").onclick = async () => {
  const result = $("weather-result");
  $("test-location").disabled = true;
  result.hidden = false;
  result.textContent = "正在直连测试…";
  try {
    const location = await jsonRequest("/settings/weather/test", {method:"POST"});
    const offset = timeZone => {
      const sample = new Date();
      return new Intl.DateTimeFormat("en", {timeZone, timeZoneName:"longOffset"})
        .formatToParts(sample).find(part => part.type === "timeZoneName")?.value;
    };
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const differs = offset(location.tz_id) !== offset(localZone);
    result.textContent = `${location.city} · ${location.tz_id}。${differs ? `与本机时区 ${localZone} 不符。` : ""}当前天气设置未改变。`;
  } catch (error) { result.textContent = `定位测试失败。${error.message}`; }

const sourceNames = {windows:"Windows 系统数据",amd_adlx:"AMD 显卡",amd_ryzen_sdk:"AMD 处理器传感器",msi_center:"MSI 主板风扇",nvidia_nvml:"NVIDIA 显卡",presentmon:"游戏 FPS",windows_battery:"Windows USB 外设",bluetooth_devices:"蓝牙外设",hid_battery:"USB HID 外设电量"};
function element(tag, content) {
  const node = document.createElement(tag);
  node.textContent = content;
  return node;
}
function metric(device, id) {
  return device?.sensors.find(sensor => sensor.id === id && sensor.status === "available" && Number.isFinite(sensor.value));
}
function metricText(sensor, digits = 0) {
  return sensor ? `${sensor.value.toLocaleString(undefined, {maximumFractionDigits:digits})}${sensor.unit === "%" ? "" : " "}${sensor.unit}`.trim() : "—";
}
function diskUsage(volumes) {
  const section = element("section", "");
  section.className = "disk-usage";
  section.append(element("h3", "磁盘占用"));
  const list = element("ul", "");
  for (const volume of volumes.toSorted((a, b) => a.name.localeCompare(b.name))) {
    const drive = /^[A-Z]:/i.exec(volume.name)?.[0].toUpperCase();
    const free = metric(volume, "free")?.value;
    const total = metric(volume, "total")?.value;
    if (!drive || !(total > 0) || free === undefined) continue;
    const used = Math.max(0, total - free);
    const percent = Math.round(used / total * 100);
    const item = element("li", `${drive} ${percent}%`);
    const label = volume.volume_label ? `${volume.volume_label} (${drive})` : drive;
    item.title = `${label} · 已用 ${Math.round(used / 1024 ** 3)} / ${Math.round(total / 1024 ** 3)} GiB`;
    list.append(item);
  }
  section.append(list.childElementCount ? list : element("p", "暂无磁盘读数"));
  return section;
}
function overviewCard(title, subtitle, value, rows, usage) {
  const card = element("section", "");
  card.className = "card metric-card";
  const label = element("p", subtitle);
  label.className = "metric-label";
  if (usage && subtitle) label.title = subtitle;
  const reading = element("strong", value);
  reading.className = "metric-value";
  const heading = element("div", "");
  heading.className = "metric-heading";
  heading.append(element("h2", title), reading);
  card.append(heading, label);
  if (usage?.unit === "%") {
    const meter = element("meter", "");
    meter.className = "usage-meter";
    meter.max = 100;
    meter.value = usage.value;
    meter.setAttribute("aria-label", `${title}使用率`);
    card.append(meter);
  } else if (usage === null) {
    const track = element("div", "");
    track.className = "usage-meter meter-placeholder";
    track.setAttribute("aria-hidden", "true");
    card.append(track);
  }
  if (rows.length) {
    const list = element("dl", "");
    list.className = "readings metric-list";
    for (const [name, text, description] of rows) {
      const value = element("dd", description ? "" : text);
      if (description) {
        const icon = value.appendChild(element("span", ""));
        icon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        icon.querySelector("path").setAttribute("d", text);
        icon.title = description;
        icon.setAttribute("role", "img");
        icon.setAttribute("aria-label", description);
      }
      list.append(element("dt", name), value);
    }
    card.append(list);
  }
  return card;
}
function renderOverview(backends = []) {
  const source = id => backends.find(item => item.source === id);
  const devices = (id, kind) => {
    const backend = source(id);
    return backend?.status === "available" ? backend.devices.filter(device => device.kind === kind) : [];
  };
  const cpu = devices("windows", "cpu")[0];
  const cpuSensors = devices("amd_ryzen_sdk", "cpu")[0];
  const gpu = [...devices("amd_adlx", "gpu"), ...devices("nvidia_nvml", "gpu")]
    .sort((a, b) => (metric(b, "memory_total")?.value ?? 0) - (metric(a, "memory_total")?.value ?? 0))[0];
  const frame = devices("presentmon", "frames")[0];
  const fans = (devices("msi_center", "motherboard")[0]?.sensors ?? [])
    .filter(sensor => sensor.status === "available" && sensor.unit === "RPM" && Number.isFinite(sensor.value)
      && (sensor.value > 0 || sensor.seen_spinning === true));
  const batteries = [...devices("windows_battery", "battery"), ...devices("bluetooth_devices", "battery"), ...devices("hid_battery", "battery")]
    .filter(device => metric(device, "charge"));
  const connections = new Map([
    ["usb", ["M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v4", "USB 设备在线"]],
    ["usb_interface", ["M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v4", "USB 接口在线。通过接收器连接时，手柄本体的无线状态未知。"]],
    ["usb_receiver", ["M9 11V4h6v7M8 11h8a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Zm3-4h2m-2 9h2", "USB 接收器在线，外设本体连接状态未知。"]],
    ["bluetooth", ["m7 7 10 10-5 5V2l5 5L7 17", "蓝牙已连接"]],
  ]);
  const connected = [...devices("windows_battery", "gamepad"), ...devices("windows_battery", "peripheral"), ...devices("bluetooth_devices", "peripheral")]
    .filter(device => connections.has(device.connection))
    .map(device => [device.name, ...connections.get(device.connection)]);
  const cpuUsage = metric(cpu, "usage");
  const gpuUsage = metric(gpu, "usage");
  const memoryUsage = metric(devices("windows", "memory")[0], "usage");
  const memoryCard = overviewCard("内存", memoryUsage ? "使用率" : "暂无内存读数", metricText(memoryUsage), [], memoryUsage ?? null);
  memoryCard.append(diskUsage(devices("windows", "volume")));
  $("overview").replaceChildren(
    overviewCard("处理器", cpu?.name || "暂无处理器读数", metricText(cpuUsage), [["封装温度", metricText(metric(cpuSensors, "temperature"))], ["封装功耗", metricText(metric(cpuSensors, "socket_power"))]], cpuUsage ?? null),
    overviewCard("显卡", gpu?.name || "暂无显卡读数", metricText(gpuUsage), [["核心温度", metricText(metric(gpu, "core_temperature"))], ["显存温度", metricText(metric(gpu, "memory_temperature"))]], gpuUsage ?? null),
    memoryCard,
  );
  $("collection-details").replaceChildren(
    overviewCard("游戏 FPS", frame?.name || (backends.length ? "等待前台游戏" : "暂无游戏帧率"), metricText(metric(frame, "fps"), 1), frame ? [["1% low", metricText(metric(frame, "fps_1_percent_low"), 1)]] : []),
    overviewCard("主板风扇", fans.length ? "" : "暂无风扇读数", "", fans.map(sensor => [sensor.label, metricText(sensor)])),
    overviewCard("设备与电量", batteries.length || connected.length ? "" : "暂无设备读数", "", [...batteries.map(device => [device.name, metricText(metric(device, "charge"))]), ...connected]),
  );
}
function updateCollectionStatus(state, text, notice = "") {
  const status = $("collection-status");
  const message = $("collection-notice");
  status.dataset.state = state;
  if (status.textContent !== text) status.textContent = text;
  message.hidden = !notice;
  if (message.textContent !== notice) message.textContent = notice;
}
async function refreshCollection() {
  try {
    if ($("collection").hidden || document.hidden) return;
    const snapshot = await jsonRequest("/snapshots");
    renderOverview(snapshot.backends);
    const denied = snapshot.backends.filter(source => source.status === "permission_denied");
    const names = denied.map(source => sourceNames[source.source] || source.source).join("、");
    updateCollectionStatus("connected", "已连接", names ? `${names}权限不足，请以管理员身份启动托盘采集器。` : "");
  } catch {
    if ($("collection-status").dataset.state !== "error") renderOverview();
    updateCollectionStatus("error", "采集器未连接");
  }
  finally { setTimeout(refreshCollection, 1000); }
}
renderOverview();
refreshCollection();

const limits = { apps: 11, games: 7 };
let entries = [];
let catalog = new Map();
let layout = { apps: [], games: [] };
let activeIcon;
let loaded = false;
let saving = false;
let pickerRow;
let dirty = false;
function showRecentApps(ids) {
  const pinned = new Set(layout.apps.map(item => item.id));
  const names = ids.filter(id => !pinned.has(id)).map(id => catalog.get(id)?.name).filter(Boolean);
  const list = $("recent-app-list");
  const empty = $("recent-app-empty");
  list.replaceChildren(...names.map(name => element("li", name)));
  list.hidden = names.length === 0;
  empty.hidden = names.length > 0;
  empty.textContent = "暂无可补位的应用";
}
async function refreshRecentApps() {
  try {
    if (loaded && !$("shortcuts").hidden && !document.hidden) showRecentApps(await jsonRequest("/shortcuts/recent-apps"));
  } catch {
    if ($("recent-app-list").hidden) $("recent-app-empty").textContent = "暂时无法读取最近应用";
  }
  finally { setTimeout(refreshRecentApps, 3000); }
}
refreshRecentApps();
const status = value => {
  $("status").textContent = value;
  $("status").hidden = !value;
};
function renderCatalog() {
  const query = $("search").value.trim().toLocaleLowerCase();
  const source = $("source").value;
  const bound = new Set(layout[pickerRow].map(item => item.id));
  const kind = pickerRow === "apps" ? "app" : "game";
  const choices = entries.filter(item => item.kind === kind && !bound.has(item.id) && (!source || item.source === source) && item.name.toLocaleLowerCase().includes(query));
  $("candidates").replaceChildren(...choices.map(item => {
    const row = element("div", "");
    row.className = "picker-item";
    const addButton = button("添加", () => add(pickerRow, item.id));
    addButton.setAttribute("aria-label", `添加 ${item.name}`);
    row.append(element("span", item.name), element("small", item.source), addButton);
    return row;
  }));
  $("picker-empty").hidden = choices.length > 0;
  $("picker-count").hidden = choices.length === 0;
  $("picker-count").textContent = choices.length ? `${choices.length} 个可添加的快捷方式` : "";
  $("candidates").scrollTop = 0;
}
function openPicker(row) {
  pickerRow = row;
  $("picker-title").textContent = row === "apps" ? "添加到应用栏" : "添加到游戏栏";
  $("search").value = "";
  $("source").value = "";
  $("source").hidden = row === "games";
  renderCatalog();
  $("shortcut-picker").showModal();
}
function button(label, handler, disabled = false) {
  const element = document.createElement("button");
  element.type = "button";
  element.textContent = label;
  element.disabled = disabled || saving;
  element.addEventListener("click", handler);
  return element;
}
function move(row, index, offset) {
  const items = layout[row];
  const destination = index + offset;
  if (destination < 0 || destination >= items.length) return;
  [items[index], items[destination]] = [items[destination], items[index]];
  changed();
}
function changed() { dirty = true; renderRows(); status("布局尚未保存"); }
function renderRows() {
  for (const row of Object.keys(limits)) {
    $("choose-" + row).disabled = !loaded || saving || layout[row].length >= limits[row];
    $(row + "-count").textContent = layout[row].length + " / " + limits[row];
    $(row + "-empty").hidden = layout[row].length > 0;
    $(row).replaceChildren(...layout[row].map((entry, index) => {
      const li = document.createElement("li");
      li.className = "shortcut-entry";
      const name = catalog.get(entry.id)?.name ?? "原快捷方式已移除";
      if (entry.icon) {
        const icon = document.createElement("img");
        icon.alt = "";
        icon.src = entry.icon;
        li.append(icon);
      } else {
        const mark = element("span", name.slice(0, 1));
        mark.className = "shortcut-mark";
        mark.setAttribute("aria-hidden", "true");
        li.append(mark);
      }
      li.append(element("span", name));
      const menu = element("details", "");
      menu.className = "entry-menu";
      const summary = element("summary", "⋯");
      summary.setAttribute("aria-label", `${name} 的操作`);
      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        button("上移", () => move(row, index, -1), index === 0),
        button("下移", () => move(row, index, 1), index === layout[row].length - 1),
        button("更换图标", () => { activeIcon = entry; $("icon").click(); }),
        button("恢复系统图标", () => refreshIcon(row, entry)),
        button("移除", () => { layout[row].splice(index, 1); changed(); }),
      );
      actions.addEventListener("click", () => { menu.open = false; });
      menu.append(summary, actions);
      li.append(menu);
      return li;
    }));
  }
  $("save").disabled = saving || !loaded || !dirty;
}
function add(row, id) {
  if (!catalog.has(id) || layout[row].length >= limits[row] || layout[row].some(item => item.id === id)) return;
  const entry = {id};
  layout[row].push(entry);
  $("shortcut-picker").close();
  changed();
  refreshIcon(row, entry, true);
}
async function refreshIcon(row, entry, initial = false) {
  if (entry.id.startsWith("steam:") && row === "games") {
    if (entry.icon) { delete entry.icon; changed(); }
    return;
  }
  const previous = entry.icon;
  try {
    const response = await fetch("/shortcuts/icon/" + entry.id);
    if (!response.ok) throw new Error("找不到系统图标");
    const icon = await pngIcon(await response.blob());
    if (!saving && layout[row].includes(entry) && entry.icon === previous) {
      entry.icon = icon;
      changed();
    }
  } catch (error) { if (!initial) status(error.message); }
}
$("choose-apps").onclick = () => openPicker("apps");
$("choose-games").onclick = () => openPicker("games");
$("search").oninput = renderCatalog;
$("source").onchange = renderCatalog;
async function pngIcon(file) {
  const bitmap = await createImageBitmap(file);
  try {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = Math.min(256, Math.max(bitmap.width, bitmap.height));
    const scale = canvas.width / Math.max(bitmap.width, bitmap.height);
    const x = bitmap.width * scale, y = bitmap.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bitmap, (canvas.width-x)/2, (canvas.height-y)/2, x, y);
    const png = canvas.toDataURL("image/png");
    if (png.length > 384 * 1024) throw new Error("图标过大");
    return png;
  } finally { bitmap.close(); }
}
$("icon").onchange = async () => {
  const file = $("icon").files[0];
  const entry = activeIcon;
  $("icon").value = "";
  if (!entry || !file) return;
  if (file.size > 8 * 1024 * 1024) { status("请选择 8 MB 以内的图片"); return; }
  try {
    const icon = await pngIcon(file);
    if (!saving && Object.values(layout).some(row => row.includes(entry))) {
      entry.icon = icon;
      changed();
    }
  } catch { status("无法读取这张图标图片"); }
};
$("save").onclick = async () => {
  if (!loaded || saving) return;
  saving = true;
  status("正在保存布局…");
  renderRows();
  try {
    const filtered = Object.fromEntries(Object.keys(limits).map(row => [row, layout[row].filter(entry => catalog.has(entry.id))]));
    const response = await fetch("/shortcuts/catalog", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(filtered) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    layout = filtered;
    dirty = false;
    status("已保存，壁纸将在几秒内更新。");
  } catch (error) { status("保存失败：" + error.message); }
  finally { saving = false; renderRows(); }
};
fetch("/shortcuts/catalog").then(async response => {
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  entries = result.catalog;
  catalog = new Map(entries.map(item => [item.id, item]));
  layout = result.layout;
  loaded = true;
  renderRows();
  showRecentApps(result.recent_apps ?? []);
  status("");
}).catch(error => status("读取失败：" + error.message));
</script>
</html>
